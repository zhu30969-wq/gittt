name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    name: validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cumcm-modeling/scripts/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cumcm-modeling/scripts/requirements.txt

      - name: Fetch pinned quick_validate
        env:
          QUICK_VALIDATE_URL: https://raw.githubusercontent.com/openai/codex/2c4a95736bea64256a50f7b8506bd33c181cc85a/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py
          QUICK_VALIDATE_SHA256: 1fd66498c219616fd9249eacdf16c458412ea9065a9d887fd716aeef03907762
        run: |
          curl --fail --location --silent --show-error \
            "$QUICK_VALIDATE_URL" \
            --output "$RUNNER_TEMP/quick_validate.py"
          printf '%s  %s\n' \
            "$QUICK_VALIDATE_SHA256" \
            "$RUNNER_TEMP/quick_validate.py" \
            | sha256sum --check --strict

      - name: Validate Skill metadata in UTF-8 mode
        run: python -X utf8 "$RUNNER_TEMP/quick_validate.py" cumcm-modeling

      - name: Compile Python files with py_compile
        run: |
          python -X utf8 -m py_compile \
            cumcm-modeling/scripts/*.py \
            tests/*.py

      - name: Compile executable forward-test harnesses
        run: python -X utf8 -m py_compile evals/*.py

      - name: Self-validate JSON Schemas and local references
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          script_root = Path("cumcm-modeling/scripts").resolve()
          sys.path.insert(0, str(script_root))
          from _contract_support import load_json_strict

          schema_root = Path("cumcm-modeling/references/schemas").resolve()
          schema_paths = sorted(schema_root.glob("*.schema.json"))
          required = {
              "common.schema.json",
              "manifest.schema.json",
              "problem_spec.schema.json",
              "model_spec.schema.json",
              "model_promotion.schema.json",
              "experiment.schema.json",
              "results.schema.json",
              "claims.schema.json",
              "figures.schema.json",
              "paper_build.schema.json",
              "gate_review.schema.json",
          }
          present = {path.name for path in schema_paths}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"missing required schemas: {', '.join(missing)}")

          # Validate each schema against the Draft 2020-12 metaschema first.
          # Runtime copies receive absolute retrieval URIs so every portable
          # relative $ref is resolved locally instead of reaching the network.
          schemas = {}
          registry = Registry()
          for path in schema_paths:
              schema = load_json_strict(path)
              Draft202012Validator.check_schema(schema)
              schema["$id"] = path.as_uri()
              schemas[path.name] = schema
              registry = registry.with_resource(
                  schema["$id"], Resource.from_contents(schema)
              )

          def iter_refs(node):
              if isinstance(node, dict):
                  reference = node.get("$ref")
                  if isinstance(reference, str):
                      yield reference
                  for value in node.values():
                      yield from iter_refs(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from iter_refs(value)

          resolved = 0
          for name, schema in schemas.items():
              resolver = registry.resolver(base_uri=schema["$id"])
              for reference in iter_refs(schema):
                  resolver.lookup(reference)
                  resolved += 1
          print(f"Validated {len(schemas)} schemas and {resolved} local references")
          PY

      - name: Run complete unittest suite
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify initializer CLI refusal and conflict preservation
        shell: bash
        run: |
          set -euo pipefail
          missing_year_target="$RUNNER_TEMP/cumcm-init-missing-year"
          conflict_target="$RUNNER_TEMP/cumcm-init-conflict"
          missing_year_report="$RUNNER_TEMP/cumcm-init-missing-year.json"
          conflict_report="$RUNNER_TEMP/cumcm-init-conflict.json"
          before_hashes="$RUNNER_TEMP/cumcm-init-conflict-before.sha256"
          after_hashes="$RUNNER_TEMP/cumcm-init-conflict-after.sha256"
          unverifiable_target="$RUNNER_TEMP/cumcm-init-unverifiable-engine"
          unverifiable_report="$RUNNER_TEMP/cumcm-init-unverifiable-engine.json"
          unverifiable_before_hashes="$RUNNER_TEMP/cumcm-init-unverifiable-before.sha256"
          unverifiable_after_hashes="$RUNNER_TEMP/cumcm-init-unverifiable-after.sha256"

          set +e
          python -X utf8 cumcm-modeling/scripts/init_project.py \
            "$missing_year_target" \
            --project-id project:ci-missing-year \
            >"$missing_year_report"
          missing_year_status=$?
          set -e
          if [ "$missing_year_status" -ne 10 ]; then
            echo "Expected missing --contest-year to exit 10, got $missing_year_status" >&2
            exit 1
          fi
          if ! grep -q '"code": "CONTEST_YEAR_REQUIRED"' "$missing_year_report"; then
            echo "Missing-year refusal did not report CONTEST_YEAR_REQUIRED" >&2
            exit 1
          fi
          if [ -e "$missing_year_target" ]; then
            echo "Missing-year refusal unexpectedly created $missing_year_target" >&2
            exit 1
          fi

          python -X utf8 cumcm-modeling/scripts/init_project.py \
            "$conflict_target" \
            --project-id project:ci-conflict \
            --contest-year 2035 \
            --problem-code A \
            --default-seed 42 \
            --paper-engine latex \
            >/dev/null
          (
            cd "$conflict_target"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) >"$before_hashes"

          set +e
          python -X utf8 cumcm-modeling/scripts/init_project.py \
            "$conflict_target" \
            --contest-year 2036 \
            >"$conflict_report"
          conflict_status=$?
          set -e
          if [ "$conflict_status" -ne 10 ]; then
            echo "Expected conflicting --contest-year to exit 10, got $conflict_status" >&2
            exit 1
          fi
          if ! grep -q '"code": "INITIALIZATION_PARAMETER_CONFLICT"' "$conflict_report"; then
            echo "Conflicting-year refusal did not report INITIALIZATION_PARAMETER_CONFLICT" >&2
            exit 1
          fi
          (
            cd "$conflict_target"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) >"$after_hashes"
          if ! cmp -s "$before_hashes" "$after_hashes"; then
            echo "Initializer conflict changed target file bytes" >&2
            diff -u "$before_hashes" "$after_hashes" || true
            exit 1
          fi

          python -X utf8 cumcm-modeling/scripts/init_project.py \
            "$unverifiable_target" \
            --project-id project:ci-unverifiable-engine \
            --contest-year 2035 \
            --problem-code A \
            --default-seed 42 \
            --paper-engine latex \
            >/dev/null
          UNVERIFIABLE_TARGET="$unverifiable_target" python -X utf8 - <<'PY'
          import os
          import sys
          from pathlib import Path

          script_root = Path("cumcm-modeling/scripts").resolve()
          sys.path.insert(0, str(script_root))
          from _contract_support import dump_yaml, load_yaml

          manifest_path = Path(os.environ["UNVERIFIABLE_TARGET"]) / "manifest.yaml"
          manifest = load_yaml(manifest_path)
          manifest["extensions"]["initialization"].pop("paper_engine")
          manifest["entrypoints"].pop("paper", None)
          manifest_path.write_text(
              dump_yaml(manifest), encoding="utf-8", newline="\n"
          )
          PY
          (
            cd "$unverifiable_target"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) >"$unverifiable_before_hashes"

          set +e
          python -X utf8 cumcm-modeling/scripts/init_project.py \
            "$unverifiable_target" \
            --paper-engine typst \
            >"$unverifiable_report"
          unverifiable_status=$?
          set -e
          if [ "$unverifiable_status" -ne 10 ]; then
            echo "Expected unverifiable --paper-engine to exit 10, got $unverifiable_status" >&2
            exit 1
          fi
          if ! grep -q '"code": "INITIALIZATION_PARAMETER_UNVERIFIABLE"' "$unverifiable_report"; then
            echo "Unverifiable engine refusal did not report INITIALIZATION_PARAMETER_UNVERIFIABLE" >&2
            exit 1
          fi
          if [ ! -d "$unverifiable_target" ]; then
            echo "Unverifiable engine refusal removed its existing target" >&2
            exit 1
          fi
          (
            cd "$unverifiable_target"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) >"$unverifiable_after_hashes"
          if ! cmp -s "$unverifiable_before_hashes" "$unverifiable_after_hashes"; then
            echo "Initializer unverifiable-engine refusal changed target file bytes" >&2
            diff -u "$unverifiable_before_hashes" "$unverifiable_after_hashes" || true
            exit 1
          fi

      - name: Exercise E01 complete optimization evidence chain
        shell: bash
        run: |
          python -X utf8 evals/run_complete_chain.py \
            "$RUNNER_TEMP/cumcm-e01-complete-chain"

      - name: Exercise E03 heuristic feasibility and claim strength
        shell: bash
        run: |
          python -X utf8 evals/run_heuristic_optimum.py \
            "$RUNNER_TEMP/cumcm-e03-heuristic-optimum"

      - name: Exercise held-out non-overwriting recovery
        shell: bash
        run: |
          python -X utf8 evals/run_held_out_resume.py \
            "$RUNNER_TEMP/cumcm-held-out-resume"

      - name: Exercise E18 hybrid validation facet union
        shell: bash
        run: |
          python -X utf8 evals/run_hybrid_validation_facet_union.py \
            "$RUNNER_TEMP/cumcm-e18-hybrid-facets"

      - name: Exercise E19 scenario holdout isolation
        shell: bash
        run: |
          python -X utf8 evals/run_scenario_set_holdout_isolation.py \
            "$RUNNER_TEMP/cumcm-e19-scenario-isolation"

      - name: Exercise E20 decision timing comparability
        shell: bash
        run: |
          python -X utf8 evals/run_decision_timing_comparability.py \
            "$RUNNER_TEMP/cumcm-e20-decision-timing"

      - name: Positive paper lint
        run: |
          python -X utf8 cumcm-modeling/scripts/lint_paper.py \
            tests/fixtures/paper-pass \
            --engine latex \
            --source paper/main.tex \
            --claims claims/claims.yaml \
            --figures figures/figures.yaml \
            --strict

      - name: Negative paper lint must block
        shell: bash
        run: |
          set +e
          python -X utf8 cumcm-modeling/scripts/lint_paper.py \
            tests/fixtures/paper-fail \
            --engine typst \
            --source paper/main.typ \
            --strict
          status=$?
          set -e
          if [ "$status" -ne 10 ]; then
            echo "Expected negative paper lint to exit 10, got $status"
            exit 1
          fi

      - name: Build and audit synthetic release fixture
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/cumcm-release-fixture"
          report="$RUNNER_TEMP/cumcm-release-audit.json"
          python -X utf8 tests/build_release_fixture.py "$fixture"
          python -X utf8 cumcm-modeling/scripts/manifest.py "$fixture"
          python -X utf8 cumcm-modeling/scripts/audit_project.py \
            "$fixture" \
            --json-report "$report"
          AUDIT_REPORT="$report" python -X utf8 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["AUDIT_REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit(
                  f"synthetic release audit must be PASS, got {report.get('status')!r}"
              )
          print("Synthetic release audit: PASS")
          PY

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cumcm-modeling/scripts/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cumcm-modeling/scripts/requirements.txt

      - name: Run complete Windows unittest suite
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

      - name: Exercise executable mechanism scenarios on Windows
        shell: pwsh
        run: |
          python -X utf8 evals/run_heuristic_optimum.py (Join-Path $env:RUNNER_TEMP 'cumcm-e03-heuristic-optimum')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 evals/run_hybrid_validation_facet_union.py (Join-Path $env:RUNNER_TEMP 'cumcm-e18-hybrid-facets')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 evals/run_scenario_set_holdout_isolation.py (Join-Path $env:RUNNER_TEMP 'cumcm-e19-scenario-isolation')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 evals/run_decision_timing_comparability.py (Join-Path $env:RUNNER_TEMP 'cumcm-e20-decision-timing')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and audit synthetic release on Windows
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'cumcm-release-fixture'
          python -X utf8 tests/build_release_fixture.py $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 cumcm-modeling/scripts/audit_project.py $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
